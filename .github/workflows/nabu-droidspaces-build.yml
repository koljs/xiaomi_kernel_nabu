# ============================================================
#  小米平板5 (nabu) —— 编译「真正支持 Droidspaces」的内核
#
#  背景（2026-10-08 实测）：
#    Kuugo2002/xiaomi_kernel_nabu 的 v0.1 / v0.2 发布包全部缺少
#    Droidspaces 必需配置。直接拿源码重编，结果**一模一样**。
#
#  真正根因：
#    作者的 nabu_defconfig 是「两段式」——前半是设备原生配置，
#    末尾追加了 Droidspaces 片段。但实测证明 **kconfig 不会采纳文件
#    尾部这段追加内容**：只出现在尾部的符号（IPC_NS / NETFILTER_XT_SET）
#    在产物里直接消失；与前半冲突的（SYSVIPC / PID_NS / DEVTMPFS …）
#    保留前半的值。所以这段片段从来没生效过。
#
#  本工作流的做法（不依赖 defconfig 重复行的语义）：
#    1. 给 build.sh 打补丁：在 `make defconfig` 之后插入一段
#       `scripts/config --enable ...` + `make olddefconfig`，
#       直接改写 .config 并固化 —— 这是内核社区的标准强制配置手段
#    2. 该插入段还会打印详细诊断（defconfig 尾部 / .config 前后状态）
#    3. 产出可直接刷入的 AnyKernel3 zip
#    4. 编译后校验 Image 内嵌配置（官方完整 51 项 + 1 项必须关闭），
#       不合格直接 fail，杜绝「刷进去才发现不行」
# ============================================================

name: Build nabu kernel (Droidspaces)

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "内核源码仓库"
        required: true
        default: "Kuugo2002/xiaomi_kernel_nabu"
      branch:
        description: "分支（必须与你的系统版本对应）"
        required: true
        default: "HyperOS1-ksu-next"
        type: choice
        options:
          - HyperOS1-ksu-next
          - HyperOS1-resukisu
          - HyperOS1
          - HyperOS2-ksu-next
          - HyperOS2-resukisu
          - HyperOS2
      device:
        description: "设备代号"
        required: true
        default: "nabu"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: 拉取内核源码
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.upstream_repo }}
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: 预处理 defconfig（去重）+ 给 build.sh 打补丁
        shell: bash
        run: |
          set -euo pipefail

          # ---------- 1) defconfig 去重 ----------
          # nabu_defconfig 是两段式：前半是设备原生配置，末尾追加了 Droidspaces 片段。
          # 实测：前半写成 "# CONFIG_X is not set" 的符号，末尾追加 "CONFIG_X=y" 也无效。
          # 因此把目标符号在文件中的【所有】出现删掉，只在末尾留唯一一份。
          python3 - "arch/arm64/configs/${{ inputs.device }}_defconfig" <<'PY'
          import re, sys

          p = sys.argv[1]
          ENABLE = """SYSCTL SYSVIPC POSIX_MQUEUE NAMESPACES PID_NS UTS_NS IPC_NS NET_NS USER_NS
          SECCOMP SECCOMP_FILTER CGROUPS CGROUP_DEVICE CGROUP_SCHED FAIR_GROUP_SCHED
          CGROUP_FREEZER CGROUP_NET_PRIO MEMCG CFS_BANDWIDTH CGROUP_PIDS CGROUP_CPUACCT
          DEVTMPFS OVERLAY_FS TMPFS_POSIX_ACL TMPFS_XATTR FW_LOADER FW_LOADER_USER_HELPER
          VETH BRIDGE NETFILTER BRIDGE_NETFILTER NETFILTER_ADVANCED NF_CONNTRACK
          IP_NF_IPTABLES IP_NF_FILTER NF_NAT NF_TABLES IP_NF_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_MASQUERADE NETFILTER_XT_TARGET_TCPMSS NETFILTER_XT_MATCH_ADDRTYPE
          NF_CT_NETLINK IP_ADVANCED_ROUTER IP_MULTIPLE_TABLES NF_CONNTRACK_IPV4
          NF_NAT_IPV4 IP_NF_NAT IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET
          IPV6_MULTIPLE_TABLES IP6_NF_IPTABLES IP6_NF_FILTER IP6_NF_MANGLE IP6_NF_NAT
          IP6_NF_TARGET_MASQUERADE NF_CONNTRACK_IPV6 NF_NAT_IPV6
          MODULES MODULE_UNLOAD MODVERSIONS STRICT_MODULE_RWX
          AUDIT MAGIC_SYSRQ CC_STACKPROTECTOR_STRONG DEBUG_LIST PROFILING
          FS_VERITY_BUILTIN_SIGNATURES""".split()
          VIS = "EXPERT EMBEDDED MULTIUSER".split()
          OFF = ["ANDROID_PARANOID_NETWORK"]

          names = ENABLE + VIS + OFF
          alt = "|".join(re.escape(n) for n in names)
          rx = re.compile(r"^(?:CONFIG_(?:" + alt + r")=.*"
                          r"|# CONFIG_(?:" + alt + r") is not set)\s*$")

          src = open(p, encoding="utf-8", errors="replace").read().split("\n")
          kept, n_rm = [], 0
          for ln in src:
              if rx.match(ln.strip()):
                  n_rm += 1
              else:
                  kept.append(ln)
          while kept and kept[-1].strip() == "":
              kept.pop()

          blk = ["", "#" + "=" * 62,
                 "# Droidspaces —— 由 CI 去重后唯一写入（这些符号在本文件内只此一份）",
                 "#" + "=" * 62, ""]
          blk += ["CONFIG_%s=y" % n for n in VIS]
          blk += [""] + ["CONFIG_%s=y" % n for n in ENABLE]
          blk += ["", "# 老 Android 内核默认开启此项会导致容器内无法上网，必须关闭"]
          blk += ["# CONFIG_%s is not set" % n for n in OFF] + [""]

          open(p, "w", encoding="utf-8", newline="\n").write("\n".join(kept + blk))

          print("defconfig 去重: 删除 %d 行重复条目，%d 行 -> %d 行"
                % (n_rm, len(src), len(kept) + len(blk)))
          # 校验：每个目标符号只剩一份
          txt = open(p, encoding="utf-8").read().split("\n")
          bad = []
          for n in names:
              r2 = re.compile(r"^(?:CONFIG_%s=|# CONFIG_%s is not set)"
                              % (re.escape(n), re.escape(n)))
              c = sum(1 for l in txt if r2.match(l.strip()))
              if c != 1:
                  bad.append("%s=%d" % (n, c))
          if bad:
              sys.exit("去重失败，以下符号出现次数不为 1: " + ", ".join(bad))
          print("去重校验通过：%d 个符号各出现 1 次" % len(names))
          PY

          # ---------- 2) 给 build.sh 打补丁 ----------
          mkdir -p .ci
          cat > .ci/force-ds-config.sh <<'SCRIPT'
          #!/bin/bash
          # 由 CI 注入：在 `make defconfig` 之后强制启用 Droidspaces 必需配置。
          # 参数：$1 = BUILD_DIR（含 .config 的输出目录）  $2 = MAKE_ARGS
          set -uo pipefail

          BUILD_DIR="$1"
          MAKE_ARGS="${2:-}"
          CFG="$BUILD_DIR/.config"
          DEFCONFIG="arch/arm64/configs/${3:-nabu}_defconfig"

          echo "########## [DIAG] defconfig 尾部 8 行 ##########"
          tail -8 "$DEFCONFIG"

          echo "########## [DIAG] 目标符号在 defconfig 中的全部出现位置 ##########"
          for o in SYSVIPC PID_NS IPC_NS USER_NS DEVTMPFS CGROUP_DEVICE CGROUP_PIDS NETFILTER_XT_SET SECCOMP; do
            hits=$(grep -nE "^(# )?CONFIG_$o(=| is not set)" "$DEFCONFIG" | tr '\n' ' ')
            printf '  %-22s %s\n' "$o" "${hits:-<未出现>}"
          done

          echo "########## [DIAG] make defconfig 之后 .config 的状态 ##########"
          for o in SYSVIPC PID_NS IPC_NS USER_NS DEVTMPFS CGROUP_DEVICE CGROUP_PIDS NETFILTER_XT_SET SECCOMP CFS_BANDWIDTH; do
            v=$(grep -E "^(# )?CONFIG_$o(=| is not set)" "$CFG" || echo '<缺失>')
            printf '  %-22s %s\n' "$o" "$v"
          done

          echo "########## 用 scripts/config 强制启用必需配置 ##########"
          OPTS="EXPERT EMBEDDED MULTIUSER \
          SYSCTL SYSVIPC POSIX_MQUEUE NAMESPACES PID_NS UTS_NS IPC_NS NET_NS USER_NS \
          SECCOMP SECCOMP_FILTER CGROUPS CGROUP_DEVICE CGROUP_SCHED FAIR_GROUP_SCHED \
          CGROUP_FREEZER CGROUP_NET_PRIO MEMCG CFS_BANDWIDTH CGROUP_PIDS CGROUP_CPUACCT \
          DEVTMPFS OVERLAY_FS TMPFS_POSIX_ACL TMPFS_XATTR FW_LOADER FW_LOADER_USER_HELPER \
          VETH BRIDGE NETFILTER BRIDGE_NETFILTER NETFILTER_ADVANCED NF_CONNTRACK \
          IP_NF_IPTABLES IP_NF_FILTER NF_NAT NF_TABLES IP_NF_TARGET_MASQUERADE \
          NETFILTER_XT_TARGET_MASQUERADE NETFILTER_XT_TARGET_TCPMSS NETFILTER_XT_MATCH_ADDRTYPE \
          NF_CT_NETLINK IP_ADVANCED_ROUTER IP_MULTIPLE_TABLES NF_CONNTRACK_IPV4 \
          NF_NAT_IPV4 IP_NF_NAT IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET \
          MODULES MODULE_UNLOAD MODVERSIONS STRICT_MODULE_RWX \
          AUDIT MAGIC_SYSRQ CC_STACKPROTECTOR_STRONG DEBUG_LIST PROFILING \
          FS_VERITY_BUILTIN_SIGNATURES"
          for o in $OPTS; do
            ./scripts/config --file "$CFG" --enable "$o" >/dev/null 2>&1 || echo "  !! $o 设置失败（符号可能不存在于本内核）"
          done
          ./scripts/config --file "$CFG" --disable ANDROID_PARANOID_NETWORK >/dev/null 2>&1 || true

          echo "########## make olddefconfig 固化 ##########"
          make $MAKE_ARGS olddefconfig

          echo "########## [DIAG] 固化之后 .config 的状态 ##########"
          FAIL=0
          for o in SYSVIPC PID_NS IPC_NS USER_NS DEVTMPFS CGROUP_DEVICE CGROUP_PIDS NETFILTER_XT_SET SECCOMP CFS_BANDWIDTH; do
            v=$(grep -E "^(# )?CONFIG_$o(=| is not set)" "$CFG" || echo '<缺失>')
            printf '  %-22s %s\n' "$o" "$v"
            case "$v" in
              "CONFIG_$o=y") ;;
              *) FAIL=1 ;;
            esac
          done
          if [ "$FAIL" = "1" ]; then
            echo "!!!!!! 强制后仍有项未生效，产物校验会失败 !!!!!!"
          else
            echo "所有关键项已生效"
          fi
          SCRIPT
          chmod +x .ci/force-ds-config.sh

          python3 - <<'PY'
          p = 'build.sh'
          s = open(p, encoding='utf-8').read()

          # (a) 在 defconfig 之后强制写入 Droidspaces 配置
          old = 'make $MAKE_ARGS "${TARGET_DEVICE}_defconfig"'
          n = s.count(old)
          assert n == 1, f'build.sh 中 defconfig 行出现 {n} 次，预期 1 次'
          s = s.replace(old, old + '\nbash "$SCRIPT_DIR/.ci/force-ds-config.sh" "$BUILD_DIR" "$MAKE_ARGS" "$TARGET_DEVICE"')

          # (b)+(c) KernelSU-Next 版本对齐 —— 仅 KernelSU-Next 分支需要
          #     上游 build.sh 用 `next` 分支的脚本 + `legacy` 参数，会拉到 legacy
          #     分支 HEAD，其驱动版本(33306)高于最新正式版管理器(33294)，导致管理器
          #     报「版本过低，KernelSU 无法正常工作」，root 通道起不来。
          #     ReSukiSU 分支的 build.sh 结构不同，这里自动跳过。
          KSU_OLD = 'KernelSU-Next/next/kernel/setup.sh" | bash -s legacy'
          if KSU_OLD in s:
              s = s.replace(
                  KSU_OLD,
                  'KernelSU-Next/v3.4.0-legacy/kernel/setup.sh" | bash -s v3.4.0-legacy')
              old_cc = 'MAKE_ARGS+=" CROSS_COMPILE=aarch64-linux-gnu-"'
              assert s.count(old_cc) == 1, 'CROSS_COMPILE 锚点不唯一'
              s = s.replace(
                  old_cc,
                  old_cc + '\nMAKE_ARGS+=" KSU_VERSION_OVERRIDE=33294"')
              print('已应用 KernelSU-Next 版本对齐补丁（v3.4.0-legacy + 上报版本 33294）')
          else:
              print('未检测到 KernelSU-Next 拉取行（可能是 ReSukiSU 分支），跳过版本对齐补丁')

          open(p, 'w', encoding='utf-8').write(s)
          print('build.sh 补丁完成')
          PY
          grep -n 'force-ds-config.sh\|v3.4.0-legacy\|KSU_VERSION_OVERRIDE\|setup.sh' build.sh

          # ---------- 3) 修正 IKCONFIG 数据来源 ----------
          # 本仓库 kernel/Makefile 把 config_data.gz 的来源写死成
          # arch/arm64/configs/nabu-stock_defconfig（一份原厂配置静态副本），
          # 导致 Image 内嵌配置 与 设备上的 /proc/config.gz 都不反映真实编译配置。
          # 改为指向 $(KCONFIG_CONFIG)（即 .config），让配置可被如实验证。
          python3 - <<'PY'
          p = 'kernel/Makefile'
          s = open(p, encoding='utf-8').read()
          old = '$(obj)/config_data.gz: arch/arm64/configs/nabu-stock_defconfig FORCE'
          new = '$(obj)/config_data.gz: $(KCONFIG_CONFIG) FORCE'
          n = s.count(old)
          assert n == 1, f'kernel/Makefile 中该行出现 {n} 次，预期 1 次'
          open(p, 'w', encoding='utf-8').write(s.replace(old, new))
          print('kernel/Makefile 已修正：IKCONFIG 数据源 -> $(KCONFIG_CONFIG)')
          PY
          grep -n 'config_data.gz:' kernel/Makefile

      - name: 安装 Python 2（内核旧脚本需要）
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/install-python2.sh ]; then
            sudo env INSTALL_PIP=0 bash "$GITHUB_WORKSPACE/.github/install-python2.sh"
            echo "/usr/local/bin" >> "$GITHUB_PATH"
            python2.7 --version
          else
            echo "无 install-python2.sh，跳过"
          fi

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev make zip curl python3

      - name: 安装 clang A15 工具链
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/clang-A15.tar.xz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/Kuugo2002/xiaomi_kernel_nabu/releases/download/v0.1/clang-A15.tar.xz
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/clang-A15/bin/clang"
          echo "$RUNNER_TEMP/clang-A15/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/clang-A15/bin/clang" --version

      - name: 编译内核
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh ${{ inputs.device }} -j"$(nproc)"

      - name: 校验产物是否真的支持 Droidspaces
        shell: bash
        run: |
          set -euo pipefail

          echo "########## [DIAG] 编译结束后 .config 的实际状态 ##########"
          for o in EXPERT SYSVIPC PID_NS IPC_NS USER_NS DEVTMPFS CGROUP_DEVICE \
                   CGROUP_PIDS NETFILTER_XT_SET CFS_BANDWIDTH; do
            v=$(grep -E "^(# )?CONFIG_$o(=| is not set)" ../Releases_*/.config || echo '<缺失>')
            printf '  %-22s %s\n' "$o" "$v"
          done
          echo "########## [DIAG] include/config/auto.conf ##########"
          for o in SYSVIPC PID_NS IPC_NS USER_NS DEVTMPFS; do
            v=$(grep -E "^CONFIG_$o=" ../Releases_*/include/config/auto.conf || echo '<缺失>')
            printf '  %-22s %s\n' "$o" "$v"
          done

          # 硬校验 1：编译真正使用的 .config 必须齐全（这是内核功能的真实来源）
          echo "########## 校验 .config（内核功能真实来源）##########"
          CFG=$(ls ../Releases_*/.config)
          BAD=""
          for o in SYSCTL SYSVIPC POSIX_MQUEUE NAMESPACES PID_NS UTS_NS IPC_NS NET_NS USER_NS \
                   SECCOMP SECCOMP_FILTER CGROUPS CGROUP_DEVICE CGROUP_SCHED FAIR_GROUP_SCHED \
                   CGROUP_FREEZER CGROUP_NET_PRIO MEMCG CGROUP_PIDS CGROUP_CPUACCT \
                   DEVTMPFS OVERLAY_FS TMPFS_POSIX_ACL TMPFS_XATTR FW_LOADER FW_LOADER_USER_HELPER \
                   VETH BRIDGE NETFILTER BRIDGE_NETFILTER NETFILTER_ADVANCED NF_CONNTRACK \
                   IP_NF_IPTABLES IP_NF_FILTER NF_NAT IP_NF_TARGET_MASQUERADE \
                   NETFILTER_XT_TARGET_TCPMSS IP_ADVANCED_ROUTER IP_MULTIPLE_TABLES \
                   NF_CONNTRACK_IPV4 NF_NAT_IPV4 IP_NF_NAT IP_SET IP_SET_HASH_IP \
                   IP_SET_HASH_NET NETFILTER_XT_SET \
                   MODULES MODULE_UNLOAD MODVERSIONS STRICT_MODULE_RWX \
                   AUDIT MAGIC_SYSRQ CC_STACKPROTECTOR_STRONG DEBUG_LIST PROFILING \
                   FS_VERITY_BUILTIN_SIGNATURES; do
            grep -qE "^CONFIG_$o=y" "$CFG" || BAD="$BAD $o"
          done
          if [ -n "$BAD" ]; then
            echo "!! .config 缺少:$BAD"; exit 1
          fi
          echo "  .config 全部必需项为 =y，通过"

          # 安全阀：启用 CONFIG_MODULES 后，确认没有启动关键驱动被编成模块(=m)
          # 这些驱动若变成模块且未安装，设备会无法开机。
          echo "########## 安全阀：检查 =m 符号 ##########"
          MODS=$(grep -cE '^CONFIG_[A-Z0-9_]+=m$' "$CFG" || true)
          echo "  =m 符号总数: $MODS"
          CRIT="CONFIG_MMC CONFIG_MMC_BLOCK CONFIG_MMC_SDHCI CONFIG_SCSI_UFSHCD CONFIG_SCSI_UFS_QCOM \
          CONFIG_EXT4_FS CONFIG_F2FS_FS CONFIG_BLK_DEV_INITRD CONFIG_BLK_DEV_LOOP CONFIG_DM_VERITY \
          CONFIG_DRM CONFIG_DRM_MSM CONFIG_QCOM_CLK_SMD_RPM CONFIG_PINCTRL CONFIG_PINCTRL_MSM \
          CONFIG_REGULATOR CONFIG_USB CONFIG_PHY_QCOM_QMP CONFIG_QCOM_SMEM CONFIG_ARM_SMMU \
          CONFIG_QCOM_SCM CONFIG_SPMI CONFIG_I2C CONFIG_QCOM_GENI_SE CONFIG_SERIAL_MSM_GENI \
          CONFIG_RTC_CLASS CONFIG_SCHED_WALT CONFIG_CRYPTO_DEV_QCE CONFIG_DEVTMPFS CONFIG_TMPFS"
          BADMOD=""
          for c in $CRIT; do
            if grep -qE "^$c=m$" "$CFG"; then BADMOD="$BADMOD $c"; fi
          done
          if [ -n "$BADMOD" ]; then
            echo "!! 以下启动关键驱动被编成了模块，刷机会无法开机:$BADMOD"
            exit 1
          fi
          echo "  启动关键驱动均未变成模块，通过"
          echo "  全部 =m 符号清单："
          grep -E '^CONFIG_[A-Z0-9_]+=m$' "$CFG" | sed 's/^/    /' | head -60

          # 硬校验 2：Image 内嵌配置必须与 .config 一致（证明 IKCONFIG 修补生效）
          python3 - <<'PY'
          import glob, re, sys, zlib

          paths = glob.glob('../Releases_*/arch/arm64/boot/Image')
          if not paths:
              sys.exit('未找到编译出的 Image')
          img = open(paths[0], 'rb').read()
          print('Image:', paths[0], len(img), 'bytes')

          s = img.find(b'IKCFG_ST')
          if s < 0:
              sys.exit('Image 中没有内嵌 IKCONFIG，无法校验')
          g = img.find(b'\x1f\x8b\x08', s)
          cfg = zlib.decompressobj(16 + zlib.MAX_WBITS).decompress(img[g:g + 600000])
          cfg = cfg.split(b'IKCFG_ED')[0].decode('utf-8', 'replace')
          lines = cfg.splitlines()

          need = [
              # IPC 机制
              'CONFIG_SYSCTL', 'CONFIG_SYSVIPC', 'CONFIG_POSIX_MQUEUE',
              # 核心命名空间
              'CONFIG_NAMESPACES', 'CONFIG_PID_NS', 'CONFIG_UTS_NS', 'CONFIG_IPC_NS', 'CONFIG_NET_NS',
              # Seccomp
              'CONFIG_SECCOMP', 'CONFIG_SECCOMP_FILTER',
              # Cgroups（4.14 = v1）
              'CONFIG_CGROUPS', 'CONFIG_CGROUP_DEVICE', 'CONFIG_CGROUP_SCHED',
              'CONFIG_FAIR_GROUP_SCHED', 'CONFIG_CGROUP_FREEZER', 'CONFIG_CGROUP_NET_PRIO',
              'CONFIG_MEMCG', 'CONFIG_CGROUP_PIDS', 'CONFIG_CGROUP_CPUACCT',
              # 文件系统
              'CONFIG_DEVTMPFS', 'CONFIG_OVERLAY_FS',
              'CONFIG_TMPFS_POSIX_ACL', 'CONFIG_TMPFS_XATTR',
              'CONFIG_FW_LOADER', 'CONFIG_FW_LOADER_USER_HELPER',
              # 网络隔离 NAT / none
              'CONFIG_VETH', 'CONFIG_BRIDGE', 'CONFIG_NETFILTER', 'CONFIG_BRIDGE_NETFILTER',
              'CONFIG_NETFILTER_ADVANCED', 'CONFIG_NF_CONNTRACK', 'CONFIG_IP_NF_IPTABLES',
              'CONFIG_IP_NF_FILTER', 'CONFIG_NF_NAT', 'CONFIG_NF_TABLES',
              'CONFIG_IP_NF_TARGET_MASQUERADE',
              'CONFIG_NETFILTER_XT_TARGET_TCPMSS', 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE',
              # 4.14 里 conntrack netlink 叫 NF_CT_NETLINK（不是 NF_CONNTRACK_NETLINK）
              'CONFIG_NF_CT_NETLINK', 'CONFIG_IP_ADVANCED_ROUTER', 'CONFIG_IP_MULTIPLE_TABLES',
              # legacy compat（4.14 需要）
              'CONFIG_NF_CONNTRACK_IPV4', 'CONFIG_NF_NAT_IPV4', 'CONFIG_IP_NF_NAT',
              # ipset
              'CONFIG_IP_SET', 'CONFIG_IP_SET_HASH_IP', 'CONFIG_IP_SET_HASH_NET', 'CONFIG_NETFILTER_XT_SET',
              # User namespace（容器内跑 Docker/Podman 必需）
              'CONFIG_USER_NS',
          ]
          must_off = ['CONFIG_ANDROID_PARANOID_NETWORK']

          bad = []
          for k in need:
              hit = [l for l in lines if re.match(r'^(# )?' + k + r'(=| is not set)', l)]
              st = hit[0] if hit else '<缺失>'
              print(f'  {k:<42} {st}')
              if st != k + '=y':
                  bad.append(k)
          for k in must_off:
              hit = [l for l in lines if re.match(r'^(# )?' + k + r'(=| is not set)', l)]
              st = hit[0] if hit else '<本内核无此符号>'
              print(f'  {k:<42} {st}  (必须关闭；符号不存在也算通过)')
              # 符号在本内核树里没有 Kconfig 定义时，它根本不会出现在 .config 里，
              # 也就意味着该限制没被编进内核 —— 同样满足要求。
              if st not in ('# ' + k + ' is not set', '<本内核无此符号>'):
                  bad.append(k)
          if bad:
              sys.exit('产物缺少/未关闭 Droidspaces 必需配置: ' + ', '.join(bad))
          print(f'全部 {len(need)} 项必需配置齐全，{len(must_off)} 项必须关闭项已关闭')
          PY

      - name: 收集 AnyKernel3 刷机包
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          pkgs=(../Releases_*/*.zip)
          if (( ${#pkgs[@]} == 0 )); then
            echo "没找到刷机包" >&2; exit 1
          fi
          cp -v "${pkgs[@]}" out/

      - name: 上传刷机包
        uses: actions/upload-artifact@v4
        with:
          name: nabu-anykernel3-${{ inputs.branch }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30
